name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Número da instância"
        required: true
        default: "1"

permissions:
  contents: write

jobs:

  deploy-rdp:

    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT DO REPOSITÓRIO
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ============================================================
      # 2. PREPARAR WINDOWS
      # ============================================================

      - name: Prepare Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================"
          Write-Host "PREPARING WINDOWS"
          Write-Host "========================================"

          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "Windows preparation completed."


      # ============================================================
      # 3. CONFIGURAR USUARIO RDP
      # ============================================================

      - name: Configure RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $username = "Rafael"
          $password = "P@ssw0rd!"

          Write-Host "========================================"
          Write-Host "CONFIGURING RDP USER"
          Write-Host "========================================"

          try {

            $securePassword = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

            $user = Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

            if ($null -eq $user) {

              Write-Host "Creating user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -FullName $username `
                -Description "RDP User" `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -ErrorAction Stop

            }
            else {

              Write-Host "User already exists."

              try {

                Set-LocalUser `
                  -Name $username `
                  -Password $securePassword `
                  -ErrorAction Stop

              }
              catch {

                Write-Host "Could not change existing password."
              }
            }

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $username `
              -ErrorAction SilentlyContinue

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $username `
              -ErrorAction SilentlyContinue

            Write-Host "User configuration completed."

          }
          catch {

            Write-Host "User configuration error:"
            Write-Host $_.Exception.Message
          }


      # ============================================================
      # 4. HABILITAR RDP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================"
          Write-Host "ENABLING RDP"
          Write-Host "========================================"

          try {

            Set-ItemProperty `
              -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections" `
              -Value 0 `
              -Force

            Set-ItemProperty `
              -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "UserAuthentication" `
              -Value 1 `
              -Force

            Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop" `
              -ErrorAction SilentlyContinue

            Write-Host "RDP enabled."

          }
          catch {

            Write-Host "RDP configuration error:"
            Write-Host $_.Exception.Message
          }


      # ============================================================
      # 5. CORRIGIR ÁUDIO
      # ============================================================

      - name: Fix Windows Audio
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================"
          Write-Host "FIXING WINDOWS AUDIO"
          Write-Host "========================================"

          # --------------------------------------------------------
          # AUDIO ENDPOINT BUILDER
          # --------------------------------------------------------

          try {

            $endpoint = Get-Service `
              -Name "AudioEndpointBuilder" `
              -ErrorAction SilentlyContinue

            if ($null -ne $endpoint) {

              Write-Host "AudioEndpointBuilder found."

              Set-Service `
                -Name "AudioEndpointBuilder" `
                -StartupType Automatic `
                -ErrorAction SilentlyContinue

              if ($endpoint.Status -ne "Running") {

                Start-Service `
                  -Name "AudioEndpointBuilder" `
                  -ErrorAction SilentlyContinue
              }

              Write-Host "AudioEndpointBuilder configured."
            }

          }
          catch {

            Write-Host "AudioEndpointBuilder error:"
            Write-Host $_.Exception.Message
          }


          # --------------------------------------------------------
          # WINDOWS AUDIO
          # --------------------------------------------------------

          try {

            $audio = Get-Service `
              -Name "Audiosrv" `
              -ErrorAction SilentlyContinue

            if ($null -ne $audio) {

              Write-Host "Windows Audio service found."

              Set-Service `
                -Name "Audiosrv" `
                -StartupType Automatic `
                -ErrorAction SilentlyContinue

              if ($audio.Status -ne "Running") {

                Start-Service `
                  -Name "Audiosrv" `
                  -ErrorAction SilentlyContinue
              }

              Write-Host "Windows Audio configured."
            }

          }
          catch {

            Write-Host "Windows Audio error:"
            Write-Host $_.Exception.Message
          }


          # --------------------------------------------------------
          # CONFIGURAÇÃO DE ÁUDIO DO RDP
          # --------------------------------------------------------

          try {

            $rdpPolicy =
              "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

            if (-not (Test-Path $rdpPolicy)) {

              New-Item `
                -Path $rdpPolicy `
                -Force | Out-Null
            }

            New-ItemProperty `
              -Path $rdpPolicy `
              -Name "fDisableAudioPlayback" `
              -PropertyType DWord `
              -Value 0 `
              -Force `
              -ErrorAction SilentlyContinue | Out-Null

            New-ItemProperty `
              -Path $rdpPolicy `
              -Name "fDisableAudioCapture" `
              -PropertyType DWord `
              -Value 0 `
              -Force `
              -ErrorAction SilentlyContinue | Out-Null

            Write-Host "RDP audio playback enabled."
            Write-Host "RDP audio capture enabled."

          }
          catch {

            Write-Host "RDP audio configuration error:"
            Write-Host $_.Exception.Message
          }


          # --------------------------------------------------------
          # VERIFICAR DISPOSITIVOS DE ÁUDIO
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Checking audio devices..."

          try {

            $audioDevices = Get-PnpDevice `
              -Class "MEDIA" `
              -ErrorAction SilentlyContinue

            if ($null -eq $audioDevices) {

              Write-Host "No MEDIA audio devices detected." `
                -ForegroundColor Yellow

            }
            else {

              foreach ($device in $audioDevices) {

                Write-Host (
                  $device.FriendlyName +
                  " | Status: " +
                  $device.Status
                )
              }
            }

          }
          catch {

            Write-Host "Could not enumerate audio devices."
          }

          Write-Host ""
          Write-Host "Audio configuration completed."


      # ============================================================
      # 6. INSTALAR TAILSCALE
      # ============================================================

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "INSTALLING TAILSCALE"
          Write-Host "========================================"

          $url =
            "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer =
            "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {

            throw "Tailscale installation failed: $($process.ExitCode)"
          }

          Write-Host "Tailscale installed."


      # ============================================================
      # 7. CONECTAR TAILSCALE
      # ============================================================

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "CONNECTING TAILSCALE"
          Write-Host "========================================"

          $authKey = $env:TAILSCALE_AUTH_KEY

          if ([string]::IsNullOrWhiteSpace($authKey)) {

            throw "TAILSCALE_AUTH_KEY is empty."
          }

          $tailscale =
            "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {

            throw "Tailscale executable not found."
          }

          $hostname =
            "enigmano-${{ github.run_id }}"

          & $tailscale up `
            "--authkey=$authKey" `
            "--hostname=$hostname"

          if ($LASTEXITCODE -ne 0) {

            throw "Tailscale connection failed."
          }

          Write-Host "Tailscale connected."

          Start-Sleep -Seconds 5


      # ============================================================
      # 8. OBTER IP
      # ============================================================

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $tailscale =
            "C:\Program Files\Tailscale\tailscale.exe"

          $ip =
            & $tailscale ip -4 2>$null |
            Select-Object -First 1

          if (
            -not [string]::IsNullOrWhiteSpace($ip)
          ) {

            $ip = $ip.Trim()

            Write-Host "Tailscale IP: $ip"

            "TAILSCALE_IP=$ip" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append `
                -Encoding utf8

          }
          else {

            Write-Host "Tailscale IP not found." `
              -ForegroundColor Yellow
          }


      # ============================================================
      # 9. VERIFICAR RDP E ÁUDIO
      # ============================================================

      - name: Verify RDP and Audio
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================"
          Write-Host "VERIFYING RDP AND AUDIO"
          Write-Host "========================================"

          # RDP
          try {

            $rdp =
              Get-ItemPropertyValue `
                -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
                -Name "fDenyTSConnections" `
                -ErrorAction SilentlyContinue

            if ($rdp -eq 0) {

              Write-Host "RDP: ENABLED"

            }
            else {

              Write-Host "RDP: DISABLED" `
                -ForegroundColor Yellow
            }

          }
          catch {

            Write-Host "Could not check RDP."
          }


          # PORTA
          try {

            $port =
              Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

            if ($null -ne $port) {

              Write-Host "RDP port 3389: LISTENING"

            }
            else {

              Write-Host "RDP port 3389: NOT LISTENING" `
                -ForegroundColor Yellow
            }

          }
          catch {

            Write-Host "Could not check port 3389."
          }


          # AUDIO
          try {

            $audio =
              Get-Service `
                -Name "Audiosrv" `
                -ErrorAction SilentlyContinue

            if ($null -ne $audio) {

              Write-Host "Windows Audio: $($audio.Status)"

            }

          }
          catch {

            Write-Host "Could not check Windows Audio."
          }


          # ENDPOINT
          try {

            $endpoint =
              Get-Service `
                -Name "AudioEndpointBuilder" `
                -ErrorAction SilentlyContinue

            if ($null -ne $endpoint) {

              Write-Host `
                "AudioEndpointBuilder: $($endpoint.Status)"
            }

          }
          catch {

            Write-Host "Could not check AudioEndpointBuilder."
          }


          # DISPOSITIVOS
          Write-Host ""
          Write-Host "Audio devices:"

          try {

            Get-PnpDevice `
              -Class "MEDIA" `
              -ErrorAction SilentlyContinue |
              Select-Object `
                FriendlyName,
                Status

          }
          catch {

            Write-Host "Could not list audio devices."
          }


      # ============================================================
      # 10. PREPARAR ESTADO
      # ============================================================

      - name: Prepare PC State
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================"
          Write-Host "PREPARING PC STATE"
          Write-Host "========================================"

          $directory = ".pc-state"
          $file = ".pc-state\state.json"

          if (-not (Test-Path $directory)) {

            New-Item `
              -ItemType Directory `
              -Path $directory `
              -Force | Out-Null
          }

          if (-not (Test-Path $file)) {

            $state = @{
              applications = @()
              updated =
                (Get-Date).ToUniversalTime().ToString("o")
            }

            $state |
              ConvertTo-Json -Depth 10 |
              Set-Content `
                -Path $file `
                -Encoding UTF8

            Write-Host "State file created."

          }
          else {

            Write-Host "State file already exists."
          }


      # ============================================================
      # 11. DETECTAR APLICATIVOS
      # ============================================================

      - name: Detect User Installed Applications
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================"
          Write-Host "DETECTING APPLICATIONS"
          Write-Host "========================================"

          $applications = @()

          $registryPaths = @(
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          foreach ($registryPath in $registryPaths) {

            Write-Host ""
            Write-Host "Reading:"
            Write-Host $registryPath

            try {

              $items = Get-ItemProperty `
                -Path $registryPath `
                -ErrorAction SilentlyContinue

              if ($null -eq $items) {
                continue
              }

              foreach ($application in $items) {

                $name =
                  [string]$application.DisplayName

                $version =
                  [string]$application.DisplayVersion

                if ([string]::IsNullOrWhiteSpace($name)) {
                  continue
                }

                $alreadyExists = $false

                foreach ($savedApplication in $applications) {

                  if ($savedApplication.Name -eq $name) {

                    $alreadyExists = $true
                    break
                  }
                }

                if (-not $alreadyExists) {

                  $applications += [PSCustomObject]@{
                    Name = $name
                    Version = $version
                    WingetId = ""
                  }
                }
              }

            }
            catch {

              Write-Host "Registry read failed:"
              Write-Host $_.Exception.Message
            }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "DETECTED APPLICATIONS"
          Write-Host "========================================"

          foreach ($application in $applications) {

            Write-Host (
              $application.Name +
              " | Version: " +
              $application.Version
            )
          }

          Write-Host ""
          Write-Host "Total applications detected:"
          Write-Host $applications.Count


          # --------------------------------------------------------
          # SALVAR ESTADO
          # --------------------------------------------------------

          $stateFile =
            ".pc-state\state.json"

          try {

            $state = $null

            if (Test-Path $stateFile) {

              $json =
                Get-Content `
                  -Path $stateFile `
                  -Raw

              if (-not [string]::IsNullOrWhiteSpace($json)) {

                $state =
                  $json | ConvertFrom-Json
              }
            }

            if ($null -eq $state) {

              $state =
                [PSCustomObject]@{
                  applications = @()
                  updated = ""
                }
            }

            $state.applications =
              @($applications)

            $state.updated =
              (Get-Date).T
